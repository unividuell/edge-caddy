<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="referrer" content="no-referrer">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'unsafe-inline'; style-src 'unsafe-inline'; img-src data:">
<link rel="icon" href="data:,">
<title>Tonprobe</title>
<!--
  Sound test for a real iPhone: does waking a Web Audio graph stop music playing in another app,
  and which audioSession type avoids it? A click-through: a hearing check without music first
  (step 0: what the knock sounds like, and does it play at all), then ten rounds (five variants, each with the
  ring/silent switch on ring and on silent), one tap and two or three questions per round, and a
  reload after each round so every variant starts from a fresh page load.

  The audio path mirrors the web app's exactly:
  - one AudioContext, created on page load (so it starts suspended), never closed;
  - waking = optionally set navigator.audioSession.type, then resume() if suspended, synchronously
    inside the click;
  - one-shots wait for the state `running`, then schedule 0.05 s ahead of currentTime;
  - every sound goes through one shared GainNode into the destination; the app runs it at gain 1,
    this page at TEST_GAIN (see there) — the only deliberate difference;
  - the wooden knock: bus gain 0.35; body sine at the pitch (0 -> 0.25 in 0.004 s, exponential to
    0.0008 over 0.09 s, linear to 0 over 0.02 s); overtone sine at 3.9x (peak 0.05, decay 0.02 s);
    700 Hz, then a fourth higher 0.12 s later.
  No requests leave the page. Answers and the log live in localStorage so they survive the reloads.
-->
<style>
  :root {
    color-scheme: light dark;
    --bg: #f6f5f2; --fg: #1d1d1b; --muted: #6b6a66; --card: #fff; --line: #dcdad4;
    --accent: #2457c5; --accent-fg: #fff; --silent: #c2410c;
  }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #161615; --fg: #ecebe7; --muted: #a09e98; --card: #22221f; --line: #3a3934; --accent: #7aa2ff; --accent-fg: #0b1430; --silent: #fb923c; }
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; background: var(--bg); color: var(--fg); }
  body { font: 18px/1.45 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; -webkit-text-size-adjust: 100%; }
  main {
    max-width: 30rem; margin: 0 auto; min-height: 100svh;
    padding: calc(16px + env(safe-area-inset-top)) 16px calc(24px + env(safe-area-inset-bottom));
    display: flex; flex-direction: column;
  }
  .progress { height: 6px; background: var(--line); border-radius: 3px; overflow: hidden; }
  .progress > div { height: 100%; background: var(--accent); transition: width .3s; }
  .top { display: flex; justify-content: space-between; align-items: center; margin-top: 8px; }
  .round { color: var(--muted); font-size: .9rem; margin: 0; }
  /* Lights up in time with each knock: shows that something was played even when nothing is heard. */
  .cue { display: flex; align-items: center; gap: 6px; color: var(--muted); font-size: .8rem; }
  .dot { width: 14px; height: 14px; border-radius: 50%; background: var(--line); }
  .dot.on { background: var(--accent); }
  /* Ring/silent switch: the setting each round needs, too important to sit in running text. */
  .sw { display: flex; align-items: center; gap: 14px; padding: 12px 16px; border-radius: 14px; border: 2px solid var(--line); background: var(--card); }
  .sw svg { width: 40px; height: 40px; flex: none; }
  .sw strong { display: block; font-size: 1.25rem; }
  .sw span { display: block; color: var(--muted); font-size: .95rem; }
  .sw.silent, .sw.silent span { color: var(--silent); border-color: var(--silent); }
  .gap { stroke: var(--card); }
  .top .gap { stroke: var(--bg); }
  .round { display: flex; align-items: center; gap: 4px; white-space: pre; }
  .round svg { width: 18px; height: 18px; }
  .round .silent { color: var(--silent); }
  #screen { flex: 1; display: flex; flex-direction: column; justify-content: center; gap: 14px; padding: 24px 0; }
  h1 { font-size: 1.7rem; line-height: 1.2; margin: 0; }
  p { margin: 0; }
  .muted { color: var(--muted); font-size: .95rem; }
  .hint { background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 12px 14px; }
  .choices { display: grid; gap: 10px; }
  button {
    font: inherit; font-weight: 600; width: 100%; min-height: 60px; padding: 14px 16px;
    border-radius: 14px; border: 1px solid var(--line); background: var(--card); color: var(--fg);
    cursor: pointer; touch-action: manipulation; -webkit-tap-highlight-color: transparent;
  }
  button.primary { background: var(--accent); color: var(--accent-fg); border-color: var(--accent); }
  button.big { min-height: 120px; font-size: 1.3rem; }
  button.link { background: none; border: 0; min-height: 44px; font-weight: 400; color: var(--muted); text-decoration: underline; }
  textarea {
    width: 100%; font: 14px/1.4 ui-monospace, Menlo, monospace; color: var(--fg); background: var(--card);
    border: 1px solid var(--line); border-radius: 10px; padding: 10px;
  }
  details { margin-top: 8px; font-size: .85rem; color: var(--muted); }
  summary { cursor: pointer; min-height: 44px; display: flex; align-items: center; }
  dl { display: grid; grid-template-columns: max-content 1fr; gap: 2px 12px; margin: 8px 0; }
  dd { margin: 0; overflow-wrap: anywhere; }
  pre { font: 11px/1.4 ui-monospace, Menlo, monospace; white-space: pre-wrap; overflow-wrap: anywhere; max-height: 16rem; overflow: auto; }
</style>
</head>
<body>
<main>
  <div class="progress"><div id="bar" style="width:0"></div></div>
  <div class="top">
    <p class="round" id="round">&nbsp;</p>
    <div class="cue" aria-hidden="true"><span>Klopfen</span><i class="dot"></i><i class="dot"></i></div>
  </div>
  <section id="screen"></section>
  <details>
    <summary>Technik</summary>
    <dl id="readout"></dl>
    <button class="link" id="wipe" type="button">Alles löschen und von vorn</button>
    <pre id="log"></pre>
  </details>
</main>

<script>
'use strict';

// ---------- audio path, mirrored from the app ----------
const START_LOOKAHEAD_SECONDS = 0.05;
const BODY = { peak: 0.25, attackS: 0.004, decayS: 0.09 };
const KNOCK = { peak: 0.05, attackS: 0.004, decayS: 0.02 };
const KNOCK_RATIO = 3.9;
const VOLUME = 0.35;
const STOP_FADE_S = 0.02;
const QUIET = 0.0008;
const PITCH = 700;
// The app's knock peaks near 0.09 and is easily lost under music. Whether music stops depends
// on the audio session, not on loudness, so the test plays it about 10 dB louder (peak ~0.3).
const TEST_GAIN = 3;

// Created on load, before any gesture, like the app's board does: it starts suspended.
const graph = typeof AudioContext === 'undefined' ? null : new AudioContext();
let output = null;

function soundOutput(g) {
  if (output) return output;
  output = g.createGain();
  output.gain.value = TEST_GAIN;
  output.connect(g.destination);
  return output;
}

function knock(g, start, hz) {
  const bus = g.createGain();
  bus.gain.value = VOLUME;
  bus.connect(soundOutput(g));
  const voice = (at, freq, v) => {
    const end = at + v.attackS + v.decayS;
    const level = g.createGain();
    level.gain.setValueAtTime(0, at);
    level.gain.linearRampToValueAtTime(v.peak, at + v.attackS);
    level.gain.exponentialRampToValueAtTime(QUIET, end);
    level.gain.linearRampToValueAtTime(0, end + STOP_FADE_S);
    level.connect(bus);
    const osc = g.createOscillator();
    osc.frequency.setValueAtTime(freq, at);
    osc.connect(level);
    osc.start(at);
    osc.stop(end + STOP_FADE_S);
  };
  voice(start, hz, BODY);
  voice(start, hz * KNOCK_RATIO, KNOCK);
}

function playOpening() {
  const t = graph.currentTime + START_LOOKAHEAD_SECONDS;
  knock(graph, t, PITCH);
  knock(graph, t + 0.12, PITCH * 4 / 3);
  flash([t, t + 0.12]);
}

// Light one dot per knock when it reaches the speaker (scheduled time plus output latency).
function flash(times) {
  const dots = document.querySelectorAll('.cue .dot');
  times.forEach((at, i) => {
    const ms = Math.max(0, (at - graph.currentTime + (graph.outputLatency || 0)) * 1000);
    setTimeout(() => {
      const d = dots[i];
      if (!d) return;
      d.classList.add('on');
      setTimeout(() => d.classList.remove('on'), 250);
    }, ms);
  });
}

function session() { return navigator.audioSession || null; }

// A one-shot stays silent on a graph that is not running: wait for the state, then schedule.
function whenRunning(timeoutMs) {
  return new Promise((resolve) => {
    if (!graph) return resolve(false);
    const t0 = Date.now();
    const tick = () => {
      if (graph.state === 'running') return resolve(true);
      if (Date.now() - t0 > timeoutMs) return resolve(false);
      setTimeout(tick, 20);
    };
    tick();
  });
}

function checkAdvance(label) {
  if (!graph) return;
  const before = graph.currentTime;
  setTimeout(() => {
    const after = graph.currentTime;
    log(`${label}: nach 1 s ${after > before ? 'läuft die Zeit' : 'steht die Zeit'} (${before.toFixed(3)} → ${after.toFixed(3)})`);
  }, 1000);
}

// The variant's wake, synchronously inside the click: session type (optional), then resume().
function wake(v) {
  const s = session();
  if (v.type) {
    if (s) {
      try { s.type = v.type; log(`session.type = „${v.type}“, liest „${s.type}“`); }
      catch (err) { log(`session.type = „${v.type}“ fehlgeschlagen: ${err && err.message}`); }
    } else log('navigator.audioSession fehlt, Sitzung nicht gesetzt');
  }
  if (!graph) { log('kein AudioContext'); return; }
  if (graph.state === 'suspended') {
    log('resume()');
    graph.resume().then(() => log('resume() erfüllt'), (err) => log(`resume() abgelehnt: ${err && err.name}`));
  } else log(`Zustand „${graph.state}“, kein resume()`);
  if (v.sound) sound(v.title);
  else whenRunning(3000).then((ok) => { log(`geweckt, ${ok ? 'läuft' : 'läuft nicht'}, nichts gespielt`); checkAdvance(v.title); });
}

// "Knock again": no session change; resume only if the graph is not running.
function knockAgain() {
  if (graph && graph.state !== 'running') {
    log(`nochmal: Zustand „${graph.state}“, resume()`);
    graph.resume().catch((err) => log(`nochmal: resume() abgelehnt: ${err && err.name}`));
  }
  sound('nochmal');
}

function sound(label) {
  whenRunning(3000).then((running) => {
    if (!running) { log(`${label}: Zustand blieb „${graph && graph.state}“, kein Klopfen`); return; }
    playOpening();
    log(`${label}: Klopfen geplant`);
    checkAdvance(label);
  });
}

// ---------- rounds ----------
const VARIANTS = [
  { id: 'app', title: '1 Wie die App (playback)', type: 'playback', sound: true },
  { id: 'auto', title: '2 Ohne Sitzung (auto)', type: null, sound: true },
  { id: 'ambient', title: '3 ambient', type: 'ambient', sound: true },
  { id: 'transient', title: '4 transient', type: 'transient', sound: true },
  { id: 'wake', title: '5 Nur wecken (playback, kein Ton)', type: 'playback', sound: false },
];
const SWITCH = ['Klingeln', 'Lautlos'];
const ROUNDS = [];
for (const sw of SWITCH) for (const v of VARIANTS) ROUNDS.push({ v, sw });

// `?gegenprobe`: does a session type outlive the reload? Silent switch on, no music: „auto“ from a
// freshly started Safari, then „playback“, then „auto“ again after only a reload. If the first
// „auto“ is silent and the last one is heard, the type of the previous page carried over.
const CHECK = new URLSearchParams(location.search).has('gegenprobe');
if (CHECK) {
  const v = (id) => VARIANTS.find((x) => x.id === id);
  ROUNDS.splice(0, ROUNDS.length, ...['auto', 'app', 'auto'].map((id) => ({ v: v(id), sw: 'Lautlos' })));
}

// ---------- persistence (survives the reload between rounds) ----------
const KEY = CHECK ? 'tonprobe-gegenprobe' : 'tonprobe-v3';
const LOG_MAX = 600;
let store = { started: false, round: 0, app: '', runs: [], log: [], note: '' };
try {
  const raw = localStorage.getItem(KEY);
  if (raw) store = Object.assign(store, JSON.parse(raw));
} catch (e) { /* private mode or blocked storage: works for this load only */ }
let wiped = false; // the unload's own log line must not write the old state back
function save() { if (wiped) return; try { localStorage.setItem(KEY, JSON.stringify(store)); } catch (e) { /* see above */ } }

const T0 = performance.now();
function snapshot() {
  const s = session();
  return `session ${s ? `„${s.type}“${s.state ? `/${s.state}` : ''}` : 'fehlt'}, context ${graph ? graph.state : 'fehlt'}, t=${graph ? graph.currentTime.toFixed(3) : '-'}`;
}
function log(text) {
  const hh = new Date().toTimeString().slice(0, 8);
  const rel = ((performance.now() - T0) / 1000).toFixed(2);
  store.log.push(`${hh} +${rel}s  ${text}  [${snapshot()}]`);
  if (store.log.length > LOG_MAX) store.log.splice(0, store.log.length - LOG_MAX);
  save();
  $('log').textContent = store.log.slice().reverse().join('\n');
}

// ---------- screens ----------
const $ = (id) => document.getElementById(id);
const el = (tag, attrs, ...kids) => {
  const n = document.createElement(tag);
  for (const [k, v] of Object.entries(attrs || {})) {
    if (k === 'on') n.addEventListener('click', v);
    else if (k === 'class') n.className = v;
    else n.setAttribute(k, v);
  }
  for (const k of kids) n.append(k);
  return n;
};
// A fast double tap must not answer the next screen's question with its second tap.
const GUARD_MS = 400;
let shownAt = 0;
function show(...nodes) {
  shownAt = performance.now();
  const s = $('screen');
  s.replaceChildren(...nodes);
  window.scrollTo(0, 0);
  const done = Math.min(store.round, ROUNDS.length);
  $('bar').style.width = `${(done / ROUNDS.length) * 100}%`;
  const label = !store.started ? '\u00a0' : done < ROUNDS.length ? `Runde ${done + 1} von ${ROUNDS.length}` : 'Fertig';
  const sw = store.started && done < ROUNDS.length ? ROUNDS[done].sw : null;
  $('round').replaceChildren(...(sw ? [switchIcon(sw), el('span', { class: sw === 'Lautlos' ? 'silent' : '' }, sw), '·'] : []), label);
}
const choices = (...btns) => el('div', { class: 'choices' }, ...btns);
const btn = (label, on, cls = '') => el('button', {
  type: 'button', class: cls,
  on: (e) => { if (performance.now() - shownAt >= GUARD_MS) on(e); },
}, label);

// Bell and slashed bell, after the iOS status-bar sign for silent mode. iOS shows nothing for
// ring, so the plain bell stands in. The slash is cut out of the bell by a gap in the background
// colour (class `gap`).
const BELL = '<path fill="currentColor" d="M12 3C8.6 3 6.3 5.6 6.3 9v4l-2 3.8v1h15.4v-1l-2-3.8V9C17.7 5.6 15.4 3 12 3z"/>'
  + '<path fill="currentColor" d="M9.6 19.3h4.8a2.4 2.4 0 0 1-4.8 0z"/>';
const SLASH = '<path class="gap" d="M3.5 3l17 17.5" stroke-width="5" stroke-linecap="round"/>'
  + '<path d="M3.5 3l17 17.5" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>';
function switchIcon(sw) {
  const span = el('span', { class: sw === 'Lautlos' ? 'silent' : 'ring' });
  span.innerHTML = `<svg viewBox="0 0 24 24" aria-hidden="true">${BELL}${sw === 'Lautlos' ? SLASH : ''}</svg>`;
  return span;
}
function switchBadge(sw, caption) {
  const b = el('div', { class: `sw ${sw === 'Lautlos' ? 'silent' : 'ring'}` });
  b.innerHTML = `<svg viewBox="0 0 24 24" aria-hidden="true">${BELL}${sw === 'Lautlos' ? SLASH : ''}</svg>`;
  b.append(el('div', {}, el('strong', {}, sw), el('span', {}, caption)));
  return b;
}

// Step 0, before any music: the tester learns what the knock sounds like and whether this phone
// plays it at all. The probe claims the session („playback“), so a reload follows before round 1.
const PROBE = { title: 'Hörtest', type: 'playback', sound: true };

function intro() {
  show(
    el('h1', {}, 'Tonprobe'),
    el('p', {}, 'Stoppt ein kurzes Klopfen auf einer Webseite deine Musik? Erst ein Hörtest, dann 10 kurze Runden.'),
    switchBadge('Klingeln', 'Stummschalter so stellen'),
    el('p', { class: 'hint' }, 'Noch keine Musik. Ton laut.'),
    el('p', {}, 'So klingt das Klopfen: zwei kurze, helle Töne. Oben rechts blinken dabei zwei Punkte.'),
    btn('Probe-Klopfen', probeTap, 'primary big'),
  );
}

function probeTap() {
  store.probeTries = (store.probeTries || 0) + 1;
  save();
  log(`Hörtest getippt (${store.probeTries}.)`);
  wake(PROBE); // synchronous inside the click
  show(
    el('h1', {}, 'Hast du es gehört?'),
    choices(
      btn('Ja, weiter', () => probeDone('gehört'), 'primary'),
      btn('Nochmal', probeTap),
      btn('Nein, nichts', probeSilent),
    ),
  );
}

function probeSilent() {
  log('Hörtest: nichts gehört');
  show(
    el('h1', {}, 'Nichts gehört'),
    el('p', {}, 'Lauter stellen (Tasten an der Seite) und den Stummschalter auf Klingeln, dann nochmal.'),
    el('p', { class: 'muted' }, 'Haben die Punkte oben geblinkt? Dann hat die Seite den Ton abgespielt.'),
    choices(
      btn('Nochmal', probeTap, 'primary'),
      btn('Trotzdem weiter', () => probeDone('nicht gehört')),
    ),
  );
}

function probeDone(result) {
  store.probe = result;
  save();
  log(`Hörtest: ${result}`);
  show(el('h1', {}, 'Moment …'));
  location.reload(); // a fresh page for round 1
}

function musicStart() {
  show(
    el('h1', {}, 'Jetzt Musik starten'),
    el('p', { class: 'hint' }, 'Starte Musik in deiner Musik-App und komm dann hierher zurück.'),
    el('p', {}, 'Womit hörst du Musik?'),
    choices(
      ...['Spotify', 'Apple Music', 'Andere App'].map((a) => btn(a, () => {
        store.app = a; store.started = true; store.round = 0; save();
        log(`Start, Musik-App: ${a}`);
        ready();
      }, 'primary')),
    ),
  );
}

function switchCaption(i) {
  if (CHECK) return 'Stummschalter so stellen. Keine Musik.';
  if (i === 0) return 'Stummschalter so stellen';
  if (i === VARIANTS.length) return 'Jetzt umstellen!';
  return 'Stummschalter bleibt so';
}

function ready() {
  const i = store.round;
  if (i >= ROUNDS.length) return finish();
  const r = ROUNDS[i];
  const nodes = [
    el('h1', {}, CHECK ? `Gegenprobe ${i + 1} von ${ROUNDS.length}` : 'Läuft deine Musik?'),
    switchBadge(r.sw, switchCaption(i)),
    CHECK ? '' : el('p', { class: 'muted' }, 'Falls die Musik aus ist: in der Musik-App wieder starten und zurückkommen.'),
    btn('Hier tippen', () => {
      log(`Runde ${i + 1}: ${r.v.title}, ${r.sw}, getippt`);
      wake(r.v); // synchronous inside the click
      const run = { round: i + 1, variant: r.v.id, sw: r.sw };
      if (CHECK) ask(run, ['heard'], () => nextSave(run));
      else if (r.v.sound) ask(run, ['music', 'back', 'heard'], () => nextSave(run));
      else ask(run, ['music', 'back'], () => knockStep(run));
    }, 'primary big'),
  ];
  if (!CHECK && i === VARIANTS.length) nodes.unshift(el('p', {}, 'Halbzeit, danke! Gleiche Runden noch einmal, diesmal lautlos.'));
  show(...nodes);
}

const QUESTIONS = {
  music: { q: 'Was macht deine Musik?', a: ['Spielt weiter', 'Wurde leiser', 'Ist aus'], replay: true },
  back: { q: 'Warte ein paar Sekunden. Kommt sie von selbst zurück?', a: ['Ja', 'Nein'], skip: (run, pre) => run[`${pre}music`] === 'Spielt weiter' },
  heard: { q: 'Hast du das Klopfen gehört?', a: ['Ja', 'Nein'], replay: true },
};

// Ask the questions one per screen; `pre` prefixes the keys for the second half of round 5.
function ask(run, keys, then, pre = '') {
  const key = keys[0];
  if (!key) return then();
  const q = QUESTIONS[key];
  if (q.skip && q.skip(run, pre)) return ask(run, keys.slice(1), then, pre);
  const nodes = [
    el('h1', {}, q.q),
    choices(...q.a.map((a) => btn(a, () => {
      run[pre + key] = a;
      log(`Antwort ${pre}${key}: ${a}`);
      ask(run, keys.slice(1), then, pre);
    }))),
  ];
  // Unsure? Hear it again — same session, no new wake. Not in round type 5 before its knock:
  // there the question is what waking alone does, and a knock would answer a different one.
  if (q.replay && !(run.variant === 'wake' && pre === '')) {
    nodes.push(btn('Nochmal klopfen', () => {
      run.replays = (run.replays || 0) + 1;
      log(`nochmal klopfen bei Frage ${pre}${key}`);
      knockAgain();
    }, 'link'));
  }
  show(...nodes);
}

// Round type 5: after waking only, a second tap sounds the knock without touching the session.
function knockStep(run) {
  show(
    el('h1', {}, 'Noch einmal tippen'),
    el('p', {}, 'Jetzt kommt das Klopfen.'),
    btn('Hier tippen', () => {
      log('nochmal klopfen getippt');
      knockAgain();
      ask(run, ['music', 'back', 'heard'], () => nextSave(run), 'then_');
    }, 'primary big'),
  );
}

let saved = false;
function nextSave(run) {
  if (saved) return;
  saved = true;
  show(el('h1', {}, 'Gespeichert …'));
  store.runs.push(run);
  store.round += 1;
  save();
  log(`Runde ${run.round} gespeichert`);
  // A fresh page load for every round: the previous session type must not carry over.
  location.reload();
}

function finish() {
  const text = resultText();
  const ta = el('textarea', { rows: '8', readonly: '' });
  ta.value = text;
  const state = el('p', { class: 'muted' }, '');
  const note = el('textarea', { rows: '3', placeholder: 'Noch etwas aufgefallen? (optional)', style: 'font: inherit' });
  note.value = store.note || '';
  note.addEventListener('input', () => { store.note = note.value; save(); ta.value = resultText(); });
  const nodes = [
    el('h1', {}, 'Fertig, danke!'),
    el('p', {}, 'Schick mir bitte das Ergebnis.'),
    note,
  ];
  if (navigator.share) {
    nodes.push(btn('Ergebnis senden', () => {
      navigator.share({ text: resultText() }).catch(() => {});
    }, 'primary big'));
  }
  nodes.push(
    btn('Kopieren', async () => {
      const t = resultText();
      try { await navigator.clipboard.writeText(t); state.textContent = 'Kopiert, jetzt in den Chat einfügen.'; return; }
      catch (e) { /* insecure context or refused */ }
      ta.value = t; ta.focus(); ta.setSelectionRange(0, t.length);
      let ok = false;
      try { ok = document.execCommand('copy'); } catch (e) { ok = false; }
      state.textContent = ok ? 'Kopiert, jetzt in den Chat einfügen.' : 'Text unten ist markiert, bitte selbst kopieren.';
    }, navigator.share ? '' : 'primary'),
    state,
    el('details', {}, el('summary', {}, 'Text anzeigen'), ta),
  );
  show(...nodes);
}

function resultText() {
  const s = session();
  const lines = [
    'Tonprobe – Ergebnis',
    `Browser: ${navigator.userAgent}`,
    `audioSession: ${s ? 'vorhanden' : 'fehlt'}`,
    `Musik-App: ${store.app || '–'}`,
    `Hörtest ohne Musik: ${store.probe || '–'} (${store.probeTries || 0}× getippt)`,
    `Lautstärke: ${TEST_GAIN}× die der App`,
    '',
  ];
  for (const r of store.runs) {
    const v = VARIANTS.find((x) => x.id === r.variant);
    let line = `${r.round}. ${v ? v.title : r.variant}, ${r.sw}: Musik ${r.music || '?'}`;
    if (r.back) line += `, zurück: ${r.back}`;
    if (r.heard) line += `, Klopfen gehört: ${r.heard}`;
    if (r.then_music) {
      line += ` | nach 2. Tipp mit Klopfen: Musik ${r.then_music}`;
      if (r.then_back) line += `, zurück: ${r.then_back}`;
      line += `, Klopfen gehört: ${r.then_heard || '?'}`;
    }
    if (r.replays) line += ` (${r.replays}× nochmal geklopft)`;
    lines.push(line);
  }
  lines.push('', `Notiz: ${store.note || '–'}`, '', 'Protokoll:', ...store.log);
  return lines.join('\n');
}

// ---------- technical readout (folded away) ----------
let lastT = null;
function renderReadout() {
  const s = session();
  let adv = '…';
  if (graph) { const t = graph.currentTime; if (lastT !== null) adv = t > lastT ? 'läuft' : 'steht'; lastT = t; }
  const rows = [
    ['audioSession', s ? `„${s.type}“${s.state ? ` / „${s.state}“` : ''}` : 'fehlt'],
    ['AudioContext', graph ? `„${graph.state}“` : 'fehlt'],
    ['currentTime', graph ? `${graph.currentTime.toFixed(3)} s, ${adv}` : '–'],
    ['Browser', navigator.userAgent],
  ];
  $('readout').replaceChildren(...rows.flatMap(([k, v]) => [el('dt', {}, k), el('dd', {}, v)]));
}

$('wipe').addEventListener('click', () => {
  if (!confirm('Alle Antworten löschen und von vorn anfangen?')) return;
  wiped = true;
  try { localStorage.removeItem(KEY); } catch (e) { /* ignore */ }
  location.reload();
});

// What happens on its own (an interruption shows up here).
if (graph) graph.addEventListener('statechange', () => log(`AudioContext → „${graph.state}“`));
const s0 = session();
if (s0 && 'onstatechange' in s0) s0.addEventListener('statechange', () => log(`audioSession → „${s0.state}“`));
document.addEventListener('visibilitychange', () => log(document.visibilityState === 'visible' ? 'Seite wieder sichtbar' : 'Seite im Hintergrund'));

log('— Seite geladen —');
if (CHECK) { store.started = true; ready(); }
else if (store.started) ready(); else if (store.probe) musicStart(); else intro();
renderReadout();
setInterval(renderReadout, 500);
</script>
