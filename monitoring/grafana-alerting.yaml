# unividuell: Grafana alerting — rules, the mail contact point and the routing.
# Mail goes out via Gmail SMTP (GF_SMTP_* in compose.yaml) to ALERT_EMAIL_TO.
# Only production alerts; staging and local stay quiet. Like the dashboards, edits made
# in the Grafana UI do not survive a restart: change this file instead.
#
# Each rule is one query that returns a series only while it should fire (the threshold
# sits in the query), refId `Wert`: the mail's "Values" then reads `Wert=…`, nothing else.
# So no data means fine; "Monitoring-Daten fehlen" covers a silent collector instead.
apiVersion: 1

contactPoints:
  - orgId: 1
    name: email
    receivers:
      - uid: email
        type: email
        settings:
          addresses: $ALERT_EMAIL_TO
          singleEmail: true

policies:
  - orgId: 1
    receiver: email
    group_by: [grafana_folder, alertname]
    group_wait: 30s
    group_interval: 5m
    # A still-firing alert mails again after this long.
    repeat_interval: 12h

groups:
  - orgId: 1
    name: unividuell
    folder: unividuell
    interval: 1m
    rules:
      # Any 5xx answer of a Spring app.
      - uid: server-errors
        title: '5xx-Antworten'
        condition: Wert
        for: 0m
        noDataState: OK
        execErrState: Error
        annotations:
          summary: '{{ $labels.service_namespace }}: {{ printf "%.0f" $values.Wert.Value }} 5xx-Antworten in 5 min'
        data:
          - refId: Wert
            datasourceUid: prometheus
            relativeTimeRange: {from: 86400, to: 0}
            model:
              refId: Wert
              instant: true
              expr: 'sum by (service_namespace) (increase(http_server_requests_milliseconds_count{deployment_environment_name="production", status=~"5.."}[5m])) > 0'

      # ERROR (or worse) in any production container's log.
      - uid: error-logs
        title: 'Fehler im Log'
        condition: Wert
        for: 0m
        noDataState: OK
        execErrState: Error
        annotations:
          summary: '{{ $labels.service_namespace }}/{{ $labels.service_name }}: {{ printf "%.0f" $values.Wert.Value }} Fehler-Zeilen in 5 min'
        data:
          - refId: Wert
            datasourceUid: loki
            relativeTimeRange: {from: 86400, to: 0}
            model:
              refId: Wert
              queryType: instant
              expr: 'sum by (service_namespace, service_name) (count_over_time({deployment_environment_name="production"} | detected_level=~"(?i)(error|fatal|critical)" [5m])) > 0'

      # An app that sent metrics within the last day has gone quiet for 5 min: down or cut off.
      # Covers every app without listing it; one that is removed for good alerts for a day.
      - uid: app-silent
        title: 'App sendet keine Metriken'
        condition: Wert
        for: 0m
        noDataState: OK
        execErrState: Error
        annotations:
          summary: '{{ $labels.service_namespace }} sendet seit 5 min keine Metriken'
        data:
          - refId: Wert
            datasourceUid: prometheus
            relativeTimeRange: {from: 86400, to: 0}
            model:
              refId: Wert
              instant: true
              expr: 'group by (service_namespace) (last_over_time(jvm_memory_used_bytes{deployment_environment_name="production"}[1d])) unless group by (service_namespace) (last_over_time(jvm_memory_used_bytes{deployment_environment_name="production"}[5m]))'

      # An app's actuator health is not 2xx, or the app is unreachable (httpcheck in
      # otelcol-config.yaml). Staging is on the server dashboard but does not alert.
      - uid: app-down
        title: 'App down'
        condition: Wert
        for: 2m
        noDataState: OK
        execErrState: Error
        annotations:
          summary: '{{ $labels.app }} ist down (actuator health)'
        data:
          - refId: Wert
            datasourceUid: prometheus
            relativeTimeRange: {from: 86400, to: 0}
            model:
              refId: Wert
              instant: true
              expr: 'label_replace(1 - max by (http_url) (httpcheck_status{http_status_class="2xx", http_url!~".*-staging-.*"}), "app", "$1", "http_url", "http://(.+?)(-core-1)?:.*") > 0'

      # The collector itself: no host metrics or no health checks for 5 min.
      - uid: monitoring-silent
        title: 'Monitoring-Daten fehlen'
        condition: Wert
        for: 0m
        noDataState: OK
        execErrState: Error
        annotations:
          summary: 'Seit 5 min keine Host-Metriken oder Health-Checks: Collector in edge-lgtm prüfen'
        data:
          - refId: Wert
            datasourceUid: prometheus
            relativeTimeRange: {from: 86400, to: 0}
            model:
              refId: Wert
              instant: true
              expr: 'absent_over_time(system_cpu_load_average_1m{service_name="host"}[5m]) or absent_over_time(httpcheck_status[5m])'

      # Server: sustained, not spikes; thresholds far above the usual.
      - uid: disk-full
        title: 'Platte fast voll'
        condition: Wert
        for: 10m
        noDataState: OK
        execErrState: Error
        annotations:
          summary: 'Platte zu {{ printf "%.0f" $values.Wert.Value }} % belegt'
        data:
          - refId: Wert
            datasourceUid: prometheus
            relativeTimeRange: {from: 86400, to: 0}
            model:
              refId: Wert
              instant: true
              expr: 'max(system_filesystem_utilization_ratio{service_name="host"}) * 100 > 85'

      - uid: host-cpu
        title: 'CPU dauerhaft hoch'
        condition: Wert
        for: 10m
        noDataState: OK
        execErrState: Error
        annotations:
          summary: 'CPU seit 10 min bei {{ printf "%.0f" $values.Wert.Value }} %'
        data:
          - refId: Wert
            datasourceUid: prometheus
            relativeTimeRange: {from: 86400, to: 0}
            model:
              refId: Wert
              instant: true
              expr: '(1 - avg(system_cpu_utilization_ratio{service_name="host", state="idle"})) * 100 > 80'

      - uid: host-ram
        title: 'RAM fast voll'
        condition: Wert
        for: 10m
        noDataState: OK
        execErrState: Error
        annotations:
          summary: 'RAM zu {{ printf "%.0f" $values.Wert.Value }} % belegt'
        data:
          - refId: Wert
            datasourceUid: prometheus
            relativeTimeRange: {from: 86400, to: 0}
            model:
              refId: Wert
              instant: true
              expr: 'sum(system_memory_utilization_ratio{service_name="host", state="used"}) * 100 > 85'

      # Load per core: above 1.5, processes queue for the CPU (or for the disk).
      - uid: host-load
        title: 'Load dauerhaft hoch'
        condition: Wert
        for: 10m
        noDataState: OK
        execErrState: Error
        annotations:
          summary: 'Load je Kern seit 10 min bei {{ printf "%.1f" $values.Wert.Value }}'
        data:
          - refId: Wert
            datasourceUid: prometheus
            relativeTimeRange: {from: 86400, to: 0}
            model:
              refId: Wert
              instant: true
              expr: 'max(system_cpu_load_average_5m{service_name="host"}) / count(count by (cpu) (system_cpu_utilization_ratio{service_name="host"})) > 1.5'

      # Traffic burst at the edge: over 500 requests in 5 min and 10x the day's average
      # 5-min window (288 per day). A crawler, a scan or a sudden audience.
      - uid: edge-burst
        title: 'Edge: Traffic-Sprung'
        condition: Wert
        for: 0m
        noDataState: OK
        execErrState: Error
        annotations:
          summary: '{{ printf "%.0f" $values.Wert.Value }} Requests in 5 min'
        data:
          - refId: Wert
            datasourceUid: loki
            relativeTimeRange: {from: 86400, to: 0}
            model:
              refId: Wert
              queryType: instant
              expr: 'sum(count_over_time({service_namespace="edge-caddy", service_name="access-log"}[5m])) > 500 and sum(count_over_time({service_namespace="edge-caddy", service_name="access-log"}[5m])) > 10 * sum(count_over_time({service_namespace="edge-caddy", service_name="access-log"}[1d])) / 288'
