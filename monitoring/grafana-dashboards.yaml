# unividuell: every JSON file in monitoring/dashboards/ becomes a Grafana dashboard.
# Edits made in the Grafana UI do not survive a restart: change the file instead.
apiVersion: 1
providers:
  - name: unividuell
    type: file
    # The folder the alert rules (grafana-alerting.yaml) live in anyway.
    folder: unividuell
    options:
      path: /otel-lgtm/unividuell-dashboards
