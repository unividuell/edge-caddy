name: edge-caddy

services:
  caddy:
    image: caddy:2-alpine
    container_name: edge-caddy
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    environment:
      - NEWS_AUTH_USER_1=${NEWS_AUTH_USER_1}
      - NEWS_AUTH_USER_2=${NEWS_AUTH_USER_2}
      - NEWS_AUTH_HASH=${NEWS_AUTH_HASH}
      - STATS_AUTH_USER_1=${STATS_AUTH_USER_1}
      - STATS_AUTH_HASH_1=${STATS_AUTH_HASH_1}
      # Dashboard slots 2 and 3 are optional — fill the pair in .env to add a user.
      # These fallbacks are NOT default logins. Caddy refuses to adapt a basic_auth
      # entry with an empty user or hash, so an unfilled slot still needs a value.
      # The hash below was typed by hand (22x'D' salt, 31x'u' digest), not produced
      # by hashing any password, so no known password authenticates against it, and
      # inverting bcrypt at cost 14 to find one is infeasible. Verified: the slot
      # returns 401 for an empty password, for the username, and for the hash itself.
      # ($$ is compose's escape for a literal $.)
      - STATS_AUTH_USER_2=${STATS_AUTH_USER_2:-unused-slot-2}
      - STATS_AUTH_HASH_2=${STATS_AUTH_HASH_2:-$$2a$$14$$DDDDDDDDDDDDDDDDDDDDDDuuuuuuuuuuuuuuuuuuuuuuuuuuuuuuu}
      - STATS_AUTH_USER_3=${STATS_AUTH_USER_3:-unused-slot-3}
      - STATS_AUTH_HASH_3=${STATS_AUTH_HASH_3:-$$2a$$14$$DDDDDDDDDDDDDDDDDDDDDDuuuuuuuuuuuuuuuuuuuuuuuuuuuuuuu}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile
      - ./logs:/var/log/caddy
      - ./report:/srv/report:ro
      - caddy-data:/data
      - caddy-config:/config
    networks:
      - edge

  goaccess:
    image: allinurl/goaccess:latest
    container_name: edge-goaccess
    restart: unless-stopped
    # No network access needed — it only reads and writes files.
    network_mode: none
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        while :; do
          if [ -s /logs/access.log ]; then
            goaccess /logs/access.log \
              --log-format=CADDY \
              --no-global-config \
              --no-progress \
              --tz=Europe/Berlin \
              --db-path=/db \
              --restore --persist \
              --real-os \
              --html-report-title='unividuell edge' \
              -o /report/.tmp.html \
            && mv /report/.tmp.html /report/index.html
          fi
          sleep 300
        done
    volumes:
      - ./logs:/logs:ro
      - ./report:/report
      - goaccess-db:/db

volumes:
  caddy-data:
  caddy-config:
  goaccess-db:

networks:
  edge:
    external: true
