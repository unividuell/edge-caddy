name: edge-caddy

services:
  caddy:
    image: caddy:2-alpine
    container_name: edge-caddy
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    environment:
      - NEWS_AUTH_USER_1=${NEWS_AUTH_USER_1}
      - NEWS_AUTH_USER_2=${NEWS_AUTH_USER_2}
      - NEWS_AUTH_HASH=${NEWS_AUTH_HASH}
      - STATS_AUTH_USER=${STATS_AUTH_USER}
      - STATS_AUTH_HASH=${STATS_AUTH_HASH}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile
      - ./logs:/var/log/caddy
      - ./filetransfer:/srv/filetransfer:ro
      - ./prueffahrt:/srv/prueffahrt:ro
      - caddy-data:/data
      - caddy-config:/config
    networks:
      - edge

  # Metrics, logs and traces for every project: grafana/otel-lgtm bundles an OpenTelemetry
  # Collector, Prometheus, Loki, Tempo and Grafana in one container. Apps send OTLP to
  # http://edge-lgtm:4318 over the `monitoring` network; container logs are read from
  # docker's log files. Grafana is served at stats.unividuell.org behind basic_auth.
  lgtm:
    # Pinned: 0.x, a bump can change the data layout. Diff monitoring/otelcol-config.yaml
    # against the new image's copy first (see the file's header).
    image: grafana/otel-lgtm:0.22.1
    container_name: edge-lgtm
    restart: unless-stopped
    mem_limit: 2g
    environment:
      # Caddy's basic_auth is the only gate; inside it Grafana keeps its anonymous admin.
      - GF_SERVER_ROOT_URL=https://stats.unividuell.org
      # Start page: the server dashboard instead of Grafana's welcome/news panels.
      - GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH=/otel-lgtm/unividuell-dashboards/server.json
      # 30 days, then deleted. Without these Loki keeps everything and the disk fills up.
      - PROMETHEUS_EXTRA_ARGS=--storage.tsdb.retention.time=30d --storage.tsdb.retention.size=5GB
      - LOKI_EXTRA_ARGS=-compactor.retention-enabled -compactor.delete-request-store=filesystem -store.retention=720h
      # Login of countdown's read-only `monitor` role (both stacks), see monitoring/otelcol-config.yaml.
      - COUNTDOWN_DB_MONITOR_PASSWORD=${COUNTDOWN_DB_MONITOR_PASSWORD}
      # Alert mail via Gmail: sent from ALERT_SMTP_USER (with an app password, not the
      # account's) to ALERT_EMAIL_TO; see monitoring/grafana-alerting.yaml.
      - GF_SMTP_ENABLED=true
      - GF_SMTP_HOST=smtp.gmail.com:587
      - GF_SMTP_USER=${ALERT_SMTP_USER}
      - GF_SMTP_PASSWORD=${ALERT_SMTP_PASSWORD}
      - GF_SMTP_FROM_ADDRESS=${ALERT_SMTP_USER}
      - GF_SMTP_FROM_NAME=unividuell monitoring
      - ALERT_EMAIL_TO=${ALERT_EMAIL_TO}
    volumes:
      - ./monitoring/otelcol-config.yaml:/otel-lgtm/otelcol-config.yaml:ro
      - ./monitoring/grafana-dashboards.yaml:/otel-lgtm/grafana/conf/provisioning/dashboards/unividuell.yaml:ro
      # Replaces the image's own provider file: no JVM / RED sample dashboards.
      - ./monitoring/grafana-no-sample-dashboards.yaml:/otel-lgtm/grafana/conf/provisioning/dashboards/grafana-dashboards.yaml:ro
      - ./monitoring/dashboards:/otel-lgtm/unividuell-dashboards:ro
      - ./monitoring/grafana-alerting.yaml:/otel-lgtm/grafana/conf/provisioning/alerting/unividuell.yaml:ro
      - /var/lib/docker/containers:/var/lib/docker/containers:ro
      - ./logs:/caddy-logs:ro
      - lgtm-data:/data
    # OTLP for senders outside docker, local only: the home server's backup mirror reaches
    # it through an SSH tunnel (backup-mirror/).
    ports:
      - 127.0.0.1:4318:4318
    networks:
      - edge
      - monitoring

volumes:
  caddy-data:
  caddy-config:
  lgtm-data:

networks:
  edge:
    external: true
  # Apps' private services (core, postgres) join this instead of `edge` to reach edge-lgtm.
  monitoring:
    external: true
